name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            gettext autopoint cmake ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade "pip<24.0"
          python -m pip install --upgrade "cython==0.29.37" virtualenv buildozer
          buildozer --version

      - name: Configure buildozer.spec
        run: |
          # Гарантируем только наличие version (это единственное обязательное поле)
          grep -q '^version' buildozer.spec || sed -i '/\[app\]/a version = 0.1' buildozer.spec
          
          # Если вдруг осталась битая строка android.ndk = r25b — удаляем её
          sed -i '/^android\.ndk/d' buildozer.spec
          
          # Если осталась битая строка android.api — удаляем её (buildozer выберет сам)
          sed -i '/^android\.api/d' buildozer.spec
          
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo "======================"

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BetonCalc-APK
          path: bin/*.apk

      - name: Upload build log (всегда)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
