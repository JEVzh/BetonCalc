name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: STEP 1 — Перезаписать buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = BetonCalc
          package.name = betoncalc
          package.domain = org.betoncalc
          source.dir = .
          source.include_exts = py,png
          version = 0.1
          requirements = python3==3.12.11,hostpython3==3.12.11,kivy
          orientation = portrait
          fullscreen = 0
          android.accept_sdk_license = True
          android.javabuildtool = gradle
          android.ndk = r25b
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          if [ -f icon.png ]; then echo "icon.filename = ./icon.png" >> buildozer.spec; fi
          if [ -f icon_background.png ]; then echo "android.adaptive_icon_background = ./icon_background.png" >> buildozer.spec; fi
          if [ -f icon_foreground.png ]; then echo "android.adaptive_icon_foreground = ./icon_foreground.png" >> buildozer.spec; fi
          echo "===== FINAL buildozer.spec ====="
          cat buildozer.spec
          echo "================================"
          grep -qx 'requirements = python3==3.12.11,hostpython3==3.12.11,kivy' buildozer.spec || { echo "FAIL: requirements неверен"; exit 1; }
          grep -q '^android\.ndk = r25b' buildozer.spec || { echo "FAIL: ndk не задан"; exit 1; }
          echo "OK: spec эталонный"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            gettext autopoint cmake ccache \
            libltdl-dev wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade "pip<24.0"
          python -m pip install --upgrade "cython==0.29.37" virtualenv "buildozer==1.5.0"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n859f317696f67ef3d7f30a50a5560e7834b43903" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/google-gdk-license"

      - name: Setup sdkmanager wrapper + install NDK r25b
        run: |
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/tools/bin"
          printf '#!/bin/bash\nexec "%s/cmdline-tools/latest/bin/sdkmanager" --sdk_root="%s" "$@"\n' "$ANDROID_HOME" "$ANDROID_HOME" > "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"
          
          # Устанавливаем NDK r25b явно
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/tools/bin/sdkmanager" "platform-tools" "platforms;android-31" "build-tools;34.0.0" "ndk;25.2.9519653"
          
          # Создаём symlink для p4a
          ln -sfn "$ANDROID_HOME/ndk/25.2.9519653" /home/runner/.buildozer/android/platform/android-ndk-r25b

      - name: Cache downloaded packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.buildozer/android/packages
          key: buildozer-pkgs-py312-ndk25b-v1

      - name: Clean old builds
        run: |
          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/python-for-android

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK (всегда, если файл появился)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetonCalc-APK
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Extract error snippet
        if: failure()
        run: |
          LINE=$(grep -nE 'Traceback|\[ERROR\]|Build failed|Error:|error:|Exception' build.log | head -n1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            START=$((LINE-15)); [ "$START" -lt 1 ] && START=1
            END=$((LINE+40))
            sed -n "${START},${END}p" build.log > error-snippet.txt
          else
            tail -n 80 build.log > error-snippet.txt
          fi
          echo "===== error-snippet.txt ====="
          cat error-snippet.txt
          echo "============================="

      - name: Upload error snippet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-snippet
          path: error-snippet.txt
          if-no-files-found: ignore

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
