name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            cmake \
            openjdk-17-jdk \
            ccache

      - name: Install Python build tools
        run: |
          # КРИТИЧНО: pip < 24.0, т.к. в более новых версиях удалён класс
          # BuildDependencyInstallError, который использует python-for-android
          python -m pip install --upgrade "pip<24.0"
          # cython 0.29.37 — последняя стабильная версия для python-for-android
          python -m pip install --upgrade \
            "cython==0.29.37" \
            virtualenv \
            buildozer

      - name: Configure buildozer.spec
        run: |
          test -f buildozer.spec || buildozer init
          
          # Гарантируем наличие version
          if ! grep -q '^version' buildozer.spec; then
            sed -i '/\[app\]/a version = 0.1' buildozer.spec
          fi
          
          # Фиксируем стабильный NDK r25b (заменяем если уже есть)
          if grep -q '^android.ndk' buildozer.spec; then
            sed -i 's/^android.ndk.*/android.ndk = r25b/' buildozer.spec
          else
            sed -i '/\[app\]/a android.ndk = r25b' buildozer.spec
          fi
          
          # Фиксируем API level
          if grep -q '^android.api' buildozer.spec; then
            sed -i 's/^android.api.*/android.api = 33/' buildozer.spec
          else
            sed -i '/\[app\]/a android.api = 33' buildozer.spec
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BetonCalc-APK
          path: bin/*.apk

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/android/platform/build-*/
            .buildozer/logs/
