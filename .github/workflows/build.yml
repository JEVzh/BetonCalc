name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            gettext autopoint cmake ccache \
            libltdl-dev wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade "pip<24.0"
          python -m pip install --upgrade \
            "cython==0.29.37" \
            virtualenv \
            "buildozer==1.5.0"

      - name: Configure buildozer.spec
        run: |
          grep -q '^version' buildozer.spec || sed -i '/\[app\]/a version = 0.1' buildozer.spec
          grep -q '^warn_on_root' buildozer.spec || sed -i '/\[buildozer\]/a warn_on_root = 0' buildozer.spec
          grep -q '^android.accept_sdk_license' buildozer.spec || sed -i '/\[app\]/a android.accept_sdk_license = True' buildozer.spec
          
          # КРИТИЧНО: и python3, и hostpython3 одной версии!
          if grep -q '^requirements' buildozer.spec; then
            sed -i 's/^requirements.*/requirements = python3==3.11.9,hostpython3==3.11.9,kivy/' buildozer.spec
          else
            sed -i '/\[app\]/a requirements = python3==3.11.9,hostpython3==3.11.9,kivy' buildozer.spec
          fi
          
          sed -i '/^android\.ndk/d' buildozer.spec
          sed -i '/^android\.api/d' buildozer.spec
          sed -i '/^p4a\.python_version/d' buildozer.spec
          
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo "======================"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n859f317696f67ef3d7f30a50a5560e7834b43903" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/google-gdk-license"
          echo -e "\ne9acab5b5fbb560a72797e95dcda4b719fb138b3" > "$ANDROID_HOME/licenses/intel-android-extra-license"

      - name: Download and setup Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          
          mkdir -p "$ANDROID_HOME/tools/bin"
          cat > "$ANDROID_HOME/tools/bin/sdkmanager" <<'EOF'
          #!/bin/bash
          exec "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "$@"
          EOF
          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Install Android build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          $SDKMANAGER "platform-tools" "build-tools;34.0.0" "platforms;android-33" || true

      - name: Cache Buildozer packages
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.buildozer/android/packages
            /home/runner/.buildozer/android/platform
          key: buildozer-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v4-${{ runner.os }}-

      - name: Clean old builds (обязательно!)
        run: |
          # Удаляем старые сборки — там мог остаться hostpython3 3.14
          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/python-for-android

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BetonCalc-APK
          path: bin/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
