name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: STEP 1 — Перезаписать buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = BetonCalc
          package.name = betoncalc
          package.domain = org.betoncalc
          source.dir = .
          source.include_exts = py,png
          version = 0.1
          requirements = python3==3.12.11,hostpython3==3.12.11,kivy
          orientation = portrait
          fullscreen = 0
          android.accept_sdk_license = True
          android.javabuildtool = gradle
          android.archs = arm64-v8a
          android.api = 31
          android.minapi = 21
          p4a.local_recipes = ./p4a_local_recipes

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          if [ -f icon.png ]; then echo "icon.filename = ./icon.png" >> buildozer.spec; fi
          if [ -f icon_background.png ]; then echo "android.adaptive_icon_background = ./icon_background.png" >> buildozer.spec; fi
          if [ -f icon_foreground.png ]; then echo "android.adaptive_icon_foreground = ./icon_foreground.png" >> buildozer.spec; fi
          echo "===== FINAL buildozer.spec ====="
          cat buildozer.spec
          echo "================================"
          grep -qx 'requirements = python3==3.12.11,hostpython3==3.12.11,kivy' buildozer.spec || { echo "FAIL: requirements неверен (нет hostpython3!)"; exit 1; }
          grep -q '^p4a\.local_recipes' buildozer.spec || { echo "FAIL: local_recipes не задан"; exit 1; }
          echo "OK: spec эталонный"

      - name: STEP 2 — Локальный рецепт python3 (патч: убрать grp и проблемные модули)
        run: |
          mkdir -p p4a_local_recipes/python3
          cat > p4a_local_recipes/python3/__init__.py << 'PYEOF'
          from pythonforandroid.recipes.python3 import Python3Recipe
          from pythonforandroid.logger import info
          import os

          class PatchedPython3Recipe(Python3Recipe):
              def prebuild_arch(self, arch):
                  super().prebuild_arch(arch)
                  info("Patching Python3: removing grp/nis/spwd/crypt (unsupported in NDK r28c)...")
                  setup_file = os.path.join(self.get_build_dir(arch.arch), "Modules", "Setup")
                  if os.path.exists(setup_file):
                      with open(setup_file, "r") as f:
                          lines = f.readlines()
                      bad = {"grp","nis","spwd","crypt","ossaudiodev","audioop","sunau"}
                      filtered = [l for l in lines if not (l.strip().split() and l.strip().split()[0] in bad)]
                      with open(setup_file, "w") as f:
                          f.writelines(filtered)
                      info(f"Patch applied: removed {len(lines)-len(filtered)} module(s).")
                  else:
                      info(f"WARNING: {setup_file} not found, patch skipped.")

          recipe = PatchedPython3Recipe()
          PYEOF
          echo "Local recipe created:"; cat p4a_local_recipes/python3/__init__.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            gettext autopoint cmake ccache \
            libltdl-dev wget curl

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade "pip<24.0" setuptools wheel
          python -m pip install --upgrade "cython==0.29.37" virtualenv "buildozer==1.5.0"

      - name: Setup Android SDK (cmdline-tools) + wrapper
        run: |
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/tools/bin"
          printf '#!/bin/bash\nexec "%s/cmdline-tools/latest/bin/sdkmanager" --sdk_root="%s" "$@"\n' "$ANDROID_HOME" "$ANDROID_HOME" > "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Accept licenses + install SDK components
        run: |
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/tools/bin/sdkmanager" "platform-tools" "platforms;android-31" "build-tools;34.0.0"

      - name: Cache downloaded packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.buildozer/android/packages
          key: buildozer-pkgs-py312-localrecipe-arm64-v1

      - name: Clean old builds
        run: |
          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/python-for-android

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetonCalc-APK
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Extract error snippet
        if: failure()
        run: |
          {
            echo "===== real error markers ====="
            grep -nE 'Traceback|Build failed|Command failed|Error 1|error:' build.log \
              | grep -vE 'print-multi-os|checking whether|conftest|no input files' | head -n 20
            echo; echo "===== last 200 lines ====="
            tail -n 200 build.log
          } > error-snippet.txt
          cat error-snippet.txt

      - name: Upload error snippet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-snippet
          path: error-snippet.txt
          if-no-files-found: ignore

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
