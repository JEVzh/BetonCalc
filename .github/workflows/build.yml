name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: STEP 1 — ПЕРЕЗАПИСАТЬ buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = BetonCalc
          package.name = betoncalc
          package.domain = org.betoncalc
          source.dir = .
          source.include_exts = py,png
          version = 0.1
          requirements = python3==3.12.11,hostpython3==3.12.11,kivy
          orientation = portrait
          fullscreen = 0
          android.accept_sdk_license = True
          android.javabuildtool = gradle
          
          # КРИТИЧНО: используем локальный рецепт python3 с патчем
          p4a.local_recipes = ./p4a_local_recipes

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          if [ -f icon.png ]; then echo "icon.filename = ./icon.png" >> buildozer.spec; fi
          if [ -f icon_background.png ]; then echo "android.adaptive_icon_background = ./icon_background.png" >> buildozer.spec; fi
          if [ -f icon_foreground.png ]; then echo "android.adaptive_icon_foreground = ./icon_foreground.png" >> buildozer.spec; fi
          echo "===== FINAL buildozer.spec ====="
          cat buildozer.spec
          echo "================================"
          grep -qx 'requirements = python3==3.12.11,hostpython3==3.12.11,kivy' buildozer.spec || { echo "FAIL: requirements неверен"; exit 1; }
          grep -q '^p4a\.local_recipes' buildozer.spec || { echo "FAIL: local_recipes не задан"; exit 1; }
          echo "OK: spec эталонный"

      - name: STEP 2 — Создать локальный рецепт python3 с патчем
        run: |
          mkdir -p p4a_local_recipes/python3
          cat > p4a_local_recipes/python3/__init__.py << 'PYEOF'
          from pythonforandroid.recipes.python3 import Python3Recipe
          from pythonforandroid.logger import info
          import os
          import shutil

          class PatchedPython3Recipe(Python3Recipe):
              """Python3 recipe с патчем: удаляем grp и другие проблемные модули"""
              
              def prebuild_arch(self, arch):
                  super().prebuild_arch(arch)
                  info("Patching Python3: removing grp, nis, spwd, crypt modules...")
                  
                  # Путь к Modules/Setup в распакованных исходниках
                  setup_file = os.path.join(self.get_build_dir(arch.arch), "Modules", "Setup")
                  if os.path.exists(setup_file):
                      with open(setup_file, "r") as f:
                          lines = f.readlines()
                      
                      # Удаляем строки с проблемными модулями
                      filtered_lines = []
                      for line in lines:
                          stripped = line.strip()
                          # Пропускаем строки с модулями, которые не компилируются под Android/NDK r28c
                          if any(stripped.startswith(mod + " ") or stripped == mod for mod in 
                                 ["grp", "nis", "spwd", "crypt", "ossaudiodev", "audioop", "sunau"]):
                              info(f"  Removing module: {stripped.split()[0] if stripped else 'empty'}")
                              continue
                          filtered_lines.append(line)
                      
                      with open(setup_file, "w") as f:
                          f.writelines(filtered_lines)
                      
                      info("Patch applied successfully.")
                  else:
                      info(f"WARNING: {setup_file} not found, patch skipped.")

          recipe = PatchedPython3Recipe()
          PYEOF
          echo "Local python3 recipe created at p4a_local_recipes/python3/__init__.py"
          cat p4a_local_recipes/python3/__init__.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            gettext autopoint cmake ccache \
            libltdl-dev wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade "pip<24.0"
          python -m pip install --upgrade "cython==0.29.37" virtualenv "buildozer==1.5.0"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n859f317696f67ef3d7f30a50a5560e7834b43903" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/google-gdk-license"

      - name: Setup sdkmanager wrapper
        run: |
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/tools/bin"
          printf '#!/bin/bash\nexec "%s/cmdline-tools/latest/bin/sdkmanager" --sdk_root="%s" "$@"\n' "$ANDROID_HOME" "$ANDROID_HOME" > "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Cache downloaded packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.buildozer/android/packages
          key: buildozer-pkgs-py312-localrecipe-v1

      - name: Clean old builds
        run: |
          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/python-for-android

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK (всегда, если файл появился)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetonCalc-APK
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Extract error snippet
        if: failure()
        run: |
          LINE=$(grep -nE 'Traceback|\[ERROR\]|Build failed|Error:|error:|Exception' build.log | head -n1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            START=$((LINE-15)); [ "$START" -lt 1 ] && START=1
            END=$((LINE+40))
            sed -n "${START},${END}p" build.log > error-snippet.txt
          else
            tail -n 80 build.log > error-snippet.txt
          fi
          echo "===== error-snippet.txt ====="
          cat error-snippet.txt
          echo "============================="

      - name: Upload error snippet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-snippet
          path: error-snippet.txt
          if-no-files-found: ignore

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
