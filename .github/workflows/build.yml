name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            gettext autopoint cmake ccache \
            libltdl-dev wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade "pip<24.0"
          python -m pip install --upgrade "cython==0.29.37" virtualenv "buildozer==1.5.0"

      - name: Verify buildozer.spec (контроль!)
        run: |
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo "======================"
          # Жёсткий контроль: строка с hostpython3 ОБЯЗАНА быть
          if ! grep -q 'hostpython3==3.11.9' buildozer.spec; then
            echo "ОШИБКА: в buildozer.spec нет hostpython3==3.11.9!"
            echo "Откройте репозиторий и отредактируйте файл вручную."
            exit 1
          fi
          echo "✓ buildozer.spec корректен"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\n859f317696f67ef3d7f30a50a5560e7834b43903" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > /home/runner/.buildozer/android/platform/android-sdk/licenses/google-gdk-license

      - name: Setup Android SDK command-line tools
        run: |
          SDK=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/tools/bin"
          printf '#!/bin/bash\nexec "%s/cmdline-tools/latest/bin/sdkmanager" --sdk_root="%s" "$@"\n' "$SDK" "$SDK" > "$SDK/tools/bin/sdkmanager"
          chmod +x "$SDK/tools/bin/sdkmanager"

      - name: Install Android build-tools
        run: |
          SDK=/home/runner/.buildozer/android/platform/android-sdk
          "$SDK/tools/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-33" || true

      - name: Clean old build artifacts
        run: |
          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/python-for-android

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BetonCalc-APK
          path: bin/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
