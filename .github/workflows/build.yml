name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ccache zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            gettext autopoint cmake openjdk-17-jdk

      - name: Install Buildozer
        run: |
          python -m pip install "pip==25.0.1"
          python -m pip install --upgrade buildozer cython virtualenv

      - name: Setup Android SDK (современный + legacy-путь)
        run: |
          set -e
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools" "$SDK/tools/bin" "$SDK/licenses"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm -rf "$SDK/cmdline-tools/latest"
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          # Обёртка по старому пути, которую ждёт buildozer:
          cat > "$SDK/tools/bin/sdkmanager" <<EOF
          #!/bin/bash
          exec "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "\$@"
          EOF
          chmod +x "$SDK/tools/bin/sdkmanager"
          yes | "$SDK/tools/bin/sdkmanager" --licenses || true
          "$SDK/tools/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-33"
          ls "$SDK"

      - name: Ensure version in buildozer.spec
        run: |
          grep -q '^version' buildozer.spec || sed -i '/\[app\]/a version = 0.1' buildozer.spec

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BetonCalc-APK
          path: bin/*.apk
